<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
</head>
<body>
    <h1>Contact Information</h1>
    <p>You can reach me at the following:</p>
    <ul>
        <li>Email: williamsarpong@yahoomail.com</li>
        <li>Phone: (623) 456-7890</li>
        <li>LinkedIn: linkedin.com/in/williamsarpong</li>
    </ul>

    <div class="student-card">
        <h2>William Sarpong</h2>
        <p>Course: Web Development</p>
        <button>Student Card</button>
    </div>

    <div class="contact-form-container">
        <h2>Send Me a Message</h2>
        <form class="contact-form" method="post">
            <div class="form-field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>
            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
